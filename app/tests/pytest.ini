[pytest]
# Pytest 설정 파일
# 경로: app/tests/pytest.ini

# 테스트 경로
testpaths = app/tests

# Python 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 출력 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --show-capture=all
    -p no:warnings

# 마커 정의
markers =
    asyncio: 비동기 테스트
    unit: 단위 테스트
    integration: 통합 테스트
    edge_case: 엣지 케이스 테스트
    api: API 테스트
    slow: 느린 테스트
    database: 데이터베이스 테스트

# Asyncio 모드
asyncio_mode = auto

# 타임아웃 (초)
timeout = 300

# 최소 Python 버전
minversion = 3.9

# 직렬 실행 (데이터베이스 격리)
# -n auto 옵션 제거하고 순차 실행
xfail_strict = false

# Coverage
# --cov=app/services
# --cov=app/models
# --cov=app/routers
# --cov-report=html
# --cov-report=term-missing
