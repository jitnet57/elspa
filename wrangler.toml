# 🚀 Cloudflare Pages 배포 설정 (Sprint 12)
# 목적: Next.js 정적 사이트를 Cloudflare Pages에 배포
# 빌드: npm run build → ./out 폴더 생성 → wrangler pages deploy

name = "elspa"
account_id = ""  # wrangler login 후 자동 설정
pages_build_output_dir = "./frontend/.next"  # Next.js 빌드 폴더

# 프로젝트 설정
[env.production]
name = "elspa-prod"
routes = [
  { pattern = "example.com", zone_name = "example.com" },
  { pattern = "*.example.com", zone_name = "example.com" }
]

[env.staging]
name = "elspa-staging"

# 환경 변수 설정 (배포 시 사용)
[env.production.vars]
ENVIRONMENT = "production"
API_URL = "https://api.elspa.com"  # 실제 API URL로 변경

[env.staging.vars]
ENVIRONMENT = "staging"
API_URL = "https://staging-api.elspa.com"

[env.development.vars]
ENVIRONMENT = "development"
API_URL = "http://localhost:8000"

# 빌드 설정
[build]
command = "npm run build"
cwd = "./frontend"

