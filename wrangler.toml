# 🚀 Cloudflare Pages 배포 설정
# 목적: Next.js 정적 사이트를 Cloudflare Pages에 배포
# 빌드: npm run build → ./frontend/out 폴더 생성 → Cloudflare Pages 자동 배포

name = "elspa"
pages_build_output_dir = "./frontend/out"

# 빌드 설정 (frontend 폴더만 빌드, root의 requirements.txt 무시)
[build]
command = "cd frontend && npm run build"
cwd = "."

# 프로덕션 환경 변수
[env.production.vars]
ENVIRONMENT = "production"
API_URL = "https://api.elspa.com"

# 미리보기 환경 변수
[env.preview.vars]
ENVIRONMENT = "preview"
API_URL = "https://api.elspa.com"
