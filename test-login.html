<!DOCTYPE html>
<html>
<head>
  <title>ElSpa Login Test</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; }
    input { padding: 10px; width: 100%; margin: 10px 0; }
    button { padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer; }
    .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>ElSpa Login Test</h1>

  <input type="email" id="email" placeholder="Email" value="admin@elspa.com">
  <input type="password" id="password" placeholder="Password" value="admin123">
  <button onclick="testLogin()">Test Login</button>

  <div class="result" id="result"></div>

  <script>
    async function testLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '⏳ Logging in...';

      try {
        const response = await fetch('http://localhost:8000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<div class="success"><strong>✅ Login Successful!</strong><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
          localStorage.setItem('accessToken', data.access_token);
          localStorage.setItem('refreshToken', data.refresh_token);
          localStorage.setItem('user', JSON.stringify(data.user));
        } else {
          resultDiv.innerHTML = `<div class="error"><strong>❌ Login Failed</strong><pre>${JSON.stringify(data, null, 2)}</pre></div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="error"><strong>❌ Error:</strong> ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
