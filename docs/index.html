<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElSpa Payroll System API Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .topbar {
            background-color: #1a1a1a;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .topbar h1 {
            margin: 0;
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }
        .topbar p {
            margin: 0;
            color: #ccc;
            font-size: 14px;
        }
        .topbar-version {
            margin-left: auto;
            color: #999;
            font-size: 12px;
        }
        .swagger-ui {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div>
            <h1>ElSpa Payroll System</h1>
            <p>RESTful API for comprehensive payroll management in the Philippines</p>
        </div>
        <div class="topbar-version">
            <strong>Version:</strong> 1.0.0<br>
            <strong>Updated:</strong> 2026-05-21
        </div>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3/swagger-ui-bundle.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "./openapi.yaml",
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout",
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                deepLinking: true,
                showExtensions: true,
                filter: true,
                showRequestHeaders: true,
                requestInterceptor: (request) => {
                    return request;
                },
                responseInterceptor: (response) => {
                    return response;
                },
                tryItOutEnabled: true,
                displayOperationId: true,
                displayRequestDuration: true,
                persistAuthorization: true,
                validatorUrl: "https://validator.swagger.io",
                urls: [
                    {
                        url: "./openapi.yaml",
                        name: "YAML"
                    },
                    {
                        url: "./openapi.json",
                        name: "JSON"
                    }
                ]
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
