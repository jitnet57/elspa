# ============================================================
# 📌 .github/workflows/deploy-cloudflare.yml
# 📋 목적: Cloudflare Pages 배포 (백업용, 수동 실행 전용)
# ⚠️ 실제 자동 배포는 Cloudflare Pages 의 Git 연동(elspa 프로젝트)이
#    main 푸시마다 직접 빌드·배포합니다. 이 워크플로우는 CLOUDFLARE_*
#    시크릿이 등록된 경우에만 동작하는 백업 경로입니다.
# 🔧 Trigger: 수동 실행(workflow_dispatch)만
# 📅 작성일: 2026-05-22 (2026-06-01 프론트 전용 정리 + 자동 트리거 비활성화)
# ============================================================

name: Deploy to Cloudflare

on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================
  # 빌드 & Cloudflare Pages 배포
  # ==========================================
  build-and-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # 락파일이 동기화돼 있으면 빠른 npm ci, 드리프트 시 npm install 로 폴백
        run: npm ci || npm install

      - name: Build frontend
        working-directory: frontend
        # next.config.ts 의 output:"export" 로 정적 산출물이 frontend/out 에 생성됨
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment success
        run: |
          echo "🎉 Frontend deployed to Cloudflare Pages"
          echo "📍 URL: https://${{ secrets.CLOUDFLARE_PROJECT_NAME }}.pages.dev"
