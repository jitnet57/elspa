# ============================================================
# 📌 .github/workflows/pr-check.yml
# 📋 목적: Pull Request 검증 (테스트, 린트, 빌드)
# 🔧 Trigger: Pull Request 생성/업데이트
# 📅 작성일: 2026-05-22
# ============================================================

name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # Backend: Python 테스트 & 린트
  # ==========================================
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_elspa
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Python 설정
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3️⃣ 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov black flake8

      # 4️⃣ 코드 포맷 검사 (Black)
      - name: Check code formatting (Black)
        run: black --check . --exclude="/(\.git|\.venv|venv|__pycache__|\.next)/" --line-length=100
        continue-on-error: true

      # 5️⃣ Linting 검사 (Flake8)
      - name: Lint with flake8
        run: |
          flake8 app main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app main.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        continue-on-error: true

      # 6️⃣ 유닛 테스트 실행
      - name: Run tests with pytest
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_elspa
          JWT_SECRET_KEY: test-secret-key
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
        continue-on-error: true

      # 7️⃣ 커버리지 리포트 업로드
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # ==========================================
  # Frontend: Node.js 린트 & 빌드
  # ==========================================
  frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Node.js 설정
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3️⃣ 의존성 설치
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4️⃣ ESLint 실행
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint || true

      # 5️⃣ TypeScript 타입 검사
      - name: Type check with TypeScript
        working-directory: frontend
        run: npx tsc --noEmit || true

      # 6️⃣ Next.js 프로덕션 빌드
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build
        timeout-minutes: 15

      # 7️⃣ 빌드 결과 확인
      - name: Check build output
        working-directory: frontend
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next directory exists"
            du -sh .next/
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi

  # ==========================================
  # Docker: 이미지 빌드 검증
  # ==========================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Backend 이미지 빌드 (푸시 없음)
      - name: Build Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: elspa-backend:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4️⃣ Frontend 이미지 빌드 (푸시 없음)
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: elspa-frontend:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 결과 요약
  # ==========================================
  pr-summary:
    name: PR Check Summary
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: PR Check Results
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Backend tests: ${{ needs.backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ${{ needs.frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker build: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ✅ CI/CD Checks Complete\n\nAll automated checks have been executed. Review results above.'
            })
