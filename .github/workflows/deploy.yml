# ============================================================
# 📌 .github/workflows/deploy.yml
# 📋 목적: Main 브랜치 자동 배포 (빌드 + 푸시 + 배포)
# 🔧 Trigger: Main 브랜치 푸시
# 📅 작성일: 2026-05-22
# ============================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 트리거 활성화

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1️⃣ 빌드 & 테스트 (배포 전)
  # ==========================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend 테스트
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov

      - name: Run backend tests
        run: pytest tests/ -v --tb=short || true

      # Frontend 빌드
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ==========================================
  # 2️⃣ Docker 이미지 빌드 & 푸시
  # ==========================================
  build-images:
    name: Build Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta_backend.outputs.tags }}
      frontend_image: ${{ steps.meta_frontend.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # GitHub Container Registry 로그인
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend 이미지 메타데이터
      - name: Extract metadata (Backend)
        id: meta_backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Backend 이미지 빌드 & 푸시
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend 이미지 메타데이터
      - name: Extract metadata (Frontend)
        id: meta_frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Frontend 이미지 빌드 & 푸시
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3️⃣ 배포 (선택: AWS ECS, Vercel, Heroku 등)
  # ==========================================
  deploy:
    name: Deploy to Production
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔔 배포 알림 (Slack/이메일)
      - name: Notify deployment start
        run: |
          echo "🚀 배포 시작: ${{ github.ref }} (${{ github.sha }})"
          echo "Backend Image: ${{ needs.build-images.outputs.backend_image }}"
          echo "Frontend Image: ${{ needs.build-images.outputs.frontend_image }}"

      # 마이그레이션 실행 (옵션)
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 마이그레이션 대기 상태"
          # alembic upgrade head 또는 다른 마이그레이션 명령어

      # Vercel 배포 (선택)
      # - name: Deploy to Vercel
      #   uses: vercel/action@v4
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: frontend

      # AWS ECS 배포 (선택)
      # - name: Deploy to ECS
      #   env:
      #     AWS_REGION: us-east-1
      #   run: |
      #     aws ecs update-service --cluster elspa --service backend \
      #       --force-new-deployment

      # 배포 완료
      - name: Deployment complete
        run: |
          echo "✅ 배포 완료!"
          echo "📝 커밋: ${{ github.sha }}"
          echo "🔗 브랜치: ${{ github.ref }}"

  # ==========================================
  # 4️⃣ 배포 후 헬스 체크
  # ==========================================
  health-check:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Health check API
        run: |
          echo "🏥 헬스 체크 시작..."
          sleep 30  # 배포 안정화 대기
          
          # API 헬스 체크
          curl -f https://api.example.com/health || exit 1
          echo "✅ Backend 헬스 체크 통과"
          
          # Frontend 헬스 체크
          curl -f https://example.com/healthcheck || exit 1
          echo "✅ Frontend 헬스 체크 통과"
        continue-on-error: true

      - name: Notify success
        run: |
          echo "🎉 배포 및 헬스 체크 완료!"
